name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Repo-level invariants: every plugin registered, versions in sync across
      # both manifests, components at the plugin root, hook paths resolvable.
      - name: Validate repo structure
        run: python3 scripts/validate_plugins.py --strict

      # A hook script that fails to parse is only discovered at session start,
      # where a broken SessionStart hook greets every user with an error.
      - name: Check shell script syntax
        run: |
          status=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "ok   $script"
            else
              echo "FAIL $script"
              status=1
            fi
          done < <(find plugins scripts -type f -name '*.sh' | sort)
          exit $status

      - name: Check Python script syntax
        run: python3 -m compileall -q scripts plugins

      # The official manifest schema check. This is the same validation the
      # community marketplace review pipeline runs, so passing here is the
      # signal that a plugin is submittable.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate manifests
        run: |
          set -e
          claude plugin validate . --strict
          for dir in plugins/*/; do
            claude plugin validate "$dir" --strict
          done
